<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 730" width="960" height="730" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive RAG</title>
  <desc id="desc">A router LLM sends greetings to a direct reply, simple questions to a small search and complex questions to a bigger search. An evidence check decides whether to answer, or to rewrite the query and retry with a wider search, or to give up after the last attempt.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #e2e8f0; }
      .title { font: 700 22px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .sub { font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; }
      .ex { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; text-anchor: middle; }
      .edge { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .head { font: 700 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64748b; letter-spacing: .06em; }
      .q { font: 600 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .note { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .chip { font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
      .neutral { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .search { fill: #ecfeff; stroke: #06b6d4; stroke-width: 1.5; }
      .llm { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; }
      .out { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
      .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 5; animation: dash 0.9s linear infinite; }
      .loop { fill: none; stroke: #d97706; stroke-width: 2; stroke-dasharray: 6 5; animation: dash 0.9s linear infinite; }
      .hl { fill: none; stroke: #f97316; stroke-width: 3; opacity: 0; animation: glow 9s infinite; }
      @keyframes dash { to { stroke-dashoffset: -11; } }
      @keyframes glow { 0% { opacity: 0; } 2% { opacity: 1; } 15% { opacity: 1; } 18% { opacity: 0; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .flow, .loop, .hl { animation: none; } }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="729" rx="16"/>
  <text class="title" x="30" y="44">Adaptive RAG: the right effort for every question</text>
  <text class="sub" x="30" y="66">Routes the question, checks the evidence, and retries with a better query. rag_type="adaptive"</text>

  <!-- legend -->
  <rect class="llm" x="30" y="96" width="16" height="16" rx="4"/>
  <text class="note" x="54" y="109">LLM decides</text>
  <rect class="search" x="30" y="122" width="16" height="16" rx="4"/>
  <text class="note" x="54" y="135">search</text>
  <rect class="out" x="30" y="148" width="16" height="16" rx="4"/>
  <text class="note" x="54" y="161">reply / answer</text>
  <text class="note" x="30" y="190">2 to 5 LLM calls per question</text>

  <!-- question and router -->
  <rect class="neutral" x="370" y="84" width="220" height="44" rx="10"/>
  <text class="label" x="480" y="111">“How many leave days?”</text>
  <path class="flow" d="M480 130 V154" marker-end="url(#arrow)"/>

  <rect class="llm" x="360" y="158" width="240" height="56" rx="10"/>
  <text class="label" x="480" y="182">Router (LLM)</text>
  <text class="ex" x="480" y="201">direct · simple · complex</text>

  <!-- three routes -->
  <path class="flow" d="M400 216 C400 236 220 228 220 248" marker-end="url(#arrow)"/>
  <path class="flow" d="M480 216 V248" marker-end="url(#arrow)"/>
  <path class="flow" d="M560 216 C560 236 740 228 740 248" marker-end="url(#arrow)"/>

  <rect class="llm" x="110" y="252" width="220" height="56" rx="10"/>
  <text class="label" x="220" y="276">direct</text>
  <text class="ex" x="220" y="295">greetings, thanks, bye</text>

  <rect class="llm" x="370" y="252" width="220" height="56" rx="10"/>
  <text class="label" x="480" y="276">simple</text>
  <text class="ex" x="480" y="295">top_k=4 · top_n=2</text>

  <rect class="llm" x="630" y="252" width="220" height="56" rx="10"/>
  <text class="label" x="740" y="276">complex</text>
  <text class="ex" x="740" y="295">top_k=8 · top_n=4</text>

  <!-- direct reply -->
  <path class="flow" d="M220 310 V342" marker-end="url(#arrow)"/>
  <rect class="out" x="110" y="346" width="220" height="56" rx="10"/>
  <text class="label" x="220" y="370">Reply directly</text>
  <text class="ex" x="220" y="389">no search needed</text>

  <!-- search -->
  <path class="flow" d="M480 310 C480 330 560 326 560 342" marker-end="url(#arrow)"/>
  <path class="flow" d="M740 310 C740 330 660 326 660 342" marker-end="url(#arrow)"/>
  <rect class="search" x="470" y="346" width="280" height="56" rx="10"/>
  <text class="label" x="610" y="370">Retrieve + Rerank</text>
  <text class="ex" x="610" y="389">search_query, top_k, top_n</text>

  <!-- evidence check -->
  <path class="flow" d="M610 404 V432" marker-end="url(#arrow)"/>
  <rect class="llm" x="470" y="436" width="280" height="56" rx="10"/>
  <text class="label" x="610" y="460">Evidence check (LLM)</text>
  <text class="ex" x="610" y="479">enough to answer? yes / no</text>

  <!-- yes: answer -->
  <path class="flow" d="M610 494 V526" marker-end="url(#arrow)"/>
  <text class="edge" x="620" y="515">yes</text>
  <rect class="out" x="470" y="530" width="280" height="56" rx="10"/>
  <text class="label" x="610" y="554">Generate grounded answer</text>
  <text class="ex" x="610" y="573">“20 days [chunk_0]”</text>

  <!-- no: rewrite and retry -->
  <path class="loop" d="M752 456 H786" marker-end="url(#arrow-amber)"/>
  <text class="edge" x="760" y="448">no</text>
  <rect class="llm" x="790" y="436" width="150" height="56" rx="10"/>
  <text class="label" x="865" y="460">Rewrite query</text>
  <text class="ex" x="865" y="479">top_k+4 · top_n+2</text>
  <path class="loop" d="M865 434 V374 H754" marker-end="url(#arrow-amber)"/>
  <text class="edge" x="780" y="366">retry</text>

  <!-- no on last attempt: give up -->
  <path class="flow" d="M752 480 C772 480 772 558 786 558" marker-end="url(#arrow)"/>
  <rect class="neutral" x="790" y="530" width="150" height="56" rx="10"/>
  <text class="label" x="865" y="554">Give up</text>
  <text class="ex" x="865" y="573">“I don't know…”</text>
  <text class="note" x="865" y="604" text-anchor="middle">no, after max_attempts=2</text>

  <!-- highlight the main path in order -->
  <rect class="hl" x="370" y="84" width="220" height="44" rx="10" style="animation-delay:0s"/>
  <rect class="hl" x="360" y="158" width="240" height="56" rx="10" style="animation-delay:1.5s"/>
  <rect class="hl" x="370" y="252" width="220" height="56" rx="10" style="animation-delay:3s"/>
  <rect class="hl" x="470" y="346" width="280" height="56" rx="10" style="animation-delay:4.5s"/>
  <rect class="hl" x="470" y="436" width="280" height="56" rx="10" style="animation-delay:6s"/>
  <rect class="hl" x="470" y="530" width="280" height="56" rx="10" style="animation-delay:7.5s"/>

  <!-- examples -->
  <text class="head" x="30" y="632">EXAMPLES</text>
  <rect class="card" x="30" y="642" width="210" height="70" rx="10"/>
  <text class="q" x="44" y="664">“Hi there!”</text>
  <text class="chip" x="44" y="684" fill="#b45309">→ direct</text>
  <text class="note" x="44" y="702">“Hello! How can I help?”</text>

  <rect class="card" x="260" y="642" width="210" height="70" rx="10"/>
  <text class="q" x="274" y="664">“How many leave days?”</text>
  <text class="chip" x="274" y="684" fill="#b45309">→ simple</text>
  <text class="note" x="274" y="702">4 found, 2 kept → answer</text>

  <rect class="card" x="490" y="642" width="210" height="70" rx="10"/>
  <text class="q" x="504" y="664">“Compare leave and remote”</text>
  <text class="chip" x="504" y="684" fill="#b45309">→ complex</text>
  <text class="note" x="504" y="702">8 found, 4 kept → answer</text>

  <rect class="card" x="720" y="642" width="210" height="70" rx="10"/>
  <text class="q" x="734" y="664">Rewrite: “leave days?”</text>
  <text class="chip" x="734" y="684" fill="#b45309">→ “annual paid leave</text>
  <text class="chip" x="734" y="702" fill="#b45309">   days for employees”</text>
</svg>
