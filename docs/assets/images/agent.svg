<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Tool-calling agent loop</title>
  <desc id="desc">The LLM thinks, asks for a tool, the tool runs and its result is added to the messages, and the loop repeats until the LLM answers without a tool call. Example trace of the math agent solving (12 + 8) times 3 divided by 4.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #e2e8f0; }
      .title { font: 700 22px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .sub { font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; }
      .ex { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; text-anchor: middle; }
      .edge { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .head { font: 700 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64748b; letter-spacing: .06em; }
      .tr { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; white-space: pre; }
      .role { fill: #b45309; font-weight: 700; }
      .res { fill: #15803d; font-weight: 700; }
      .note { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #e2e8f0; white-space: pre; }
      .cm { fill: #94a3b8; }
      .st { fill: #86efac; }
      .neutral { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .tool { fill: #ecfeff; stroke: #06b6d4; stroke-width: 1.5; }
      .llm { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; }
      .out { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
      .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 5; animation: dash 0.9s linear infinite; }
      .loop { fill: none; stroke: #0891b2; stroke-width: 2; stroke-dasharray: 6 5; animation: dash 0.9s linear infinite; }
      .hl { fill: none; stroke: #f97316; stroke-width: 3; opacity: 0; animation: glow 10s infinite; }
      .row { fill: #fed7aa; opacity: 0; animation: glow 10s infinite; }
      @keyframes dash { to { stroke-dashoffset: -11; } }
      @keyframes glow { 0% { opacity: 0; } 2% { opacity: 1; } 18% { opacity: 1; } 21% { opacity: 0; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .flow, .loop, .hl, .row { animation: none; } }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0891b2"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="539" rx="16"/>
  <text class="title" x="30" y="44">Agents: think → call a tool → repeat</text>
  <text class="sub" x="30" y="66">BaseAgent lets the LLM call plain Python functions. MathAgent is the example.</text>

  <!-- the loop -->
  <rect class="neutral" x="100" y="86" width="200" height="48" rx="10"/>
  <text class="label" x="200" y="106">User question</text>
  <text class="ex" x="200" y="124">(12 + 8) × 3 ÷ 4 ?</text>
  <path class="flow" d="M200 136 V166" marker-end="url(#arrow)"/>

  <rect class="llm" x="100" y="170" width="200" height="56" rx="10"/>
  <text class="label" x="200" y="194">LLM thinks</text>
  <text class="ex" x="200" y="213">qwen3:4b + tools</text>
  <path class="flow" d="M200 228 V262" marker-end="url(#arrow)"/>

  <rect class="llm" x="100" y="266" width="200" height="50" rx="10"/>
  <text class="label" x="200" y="296">Tool call requested?</text>

  <path class="loop" d="M302 291 H346" marker-end="url(#arrow-teal)"/>
  <text class="edge" x="312" y="283">yes</text>
  <rect class="tool" x="350" y="266" width="170" height="50" rx="10"/>
  <text class="label" x="435" y="287">Run the tool</text>
  <text class="ex" x="435" y="305">add · multiply · divide</text>
  <path class="loop" d="M435 264 V198 H304" marker-end="url(#arrow-teal)"/>
  <text class="note" x="318" y="188">result added to messages</text>

  <path class="flow" d="M200 318 V358" marker-end="url(#arrow)"/>
  <text class="edge" x="210" y="343">no</text>
  <rect class="out" x="100" y="362" width="200" height="56" rx="10"/>
  <text class="label" x="200" y="386">Final answer</text>
  <text class="ex" x="200" y="405">“The answer is 15.”</text>

  <text class="note" x="30" y="446">Safety: unknown tools and tool errors are sent back to the LLM as text.</text>
  <text class="note" x="30" y="464">Stops after max_steps=5 with “Maximum steps reached…”.</text>

  <!-- trace -->
  <rect class="card" x="550" y="86" width="380" height="356" rx="10"/>
  <text class="head" x="568" y="110">TRACE · MathAgent</text>
  <rect class="row" x="560" y="174" width="360" height="22" rx="4" style="animation-delay:0s"/>
  <rect class="row" x="560" y="204" width="360" height="22" rx="4" style="animation-delay:2s"/>
  <rect class="row" x="560" y="234" width="360" height="22" rx="4" style="animation-delay:4s"/>
  <rect class="row" x="560" y="264" width="360" height="22" rx="4" style="animation-delay:6s"/>
  <rect class="row" x="560" y="300" width="360" height="74" rx="4" style="animation-delay:8s"/>
  <text class="tr" x="568" y="136"><tspan class="role">system</tspan>  You are a math agent…</text>
  <text class="tr" x="568" y="160"><tspan class="role">user  </tspan>  What is (12 + 8) × 3 ÷ 4?</text>
  <text class="tr" x="568" y="190"><tspan class="role">step 1</tspan>  add(a=12, b=8)      → <tspan class="res">20.0</tspan></text>
  <text class="tr" x="568" y="220"><tspan class="role">step 2</tspan>  multiply(a=20, b=3) → <tspan class="res">60.0</tspan></text>
  <text class="tr" x="568" y="250"><tspan class="role">step 3</tspan>  divide(a=60, b=4)   → <tspan class="res">15.0</tspan></text>
  <text class="tr" x="568" y="280"><tspan class="role">step 4</tspan>  no tool call → done</text>
  <text class="tr" x="568" y="318"><tspan class="role">answer</tspan>  12 + 8 = 20</text>
  <text class="tr" x="568" y="340">        20 × 3 = 60</text>
  <text class="tr" x="568" y="362">        60 ÷ 4 = 15  → <tspan class="res">15</tspan></text>
  <text class="note" x="568" y="420">4 LLM calls · 3 tool calls</text>

  <!-- highlight the loop boxes -->
  <rect class="hl" x="100" y="170" width="200" height="56" rx="10" style="animation-delay:0s"/>
  <rect class="hl" x="350" y="266" width="170" height="50" rx="10" style="animation-delay:2s"/>
  <rect class="hl" x="350" y="266" width="170" height="50" rx="10" style="animation-delay:4s"/>
  <rect class="hl" x="100" y="266" width="200" height="50" rx="10" style="animation-delay:6s"/>
  <rect class="hl" x="100" y="362" width="200" height="56" rx="10" style="animation-delay:8s"/>

  <!-- code -->
  <rect x="30" y="476" width="900" height="44" rx="12" fill="#0f172a"/>
  <text class="code" x="52" y="503">agent = MathAgent(build_agent_llm(get_settings()));  agent.run(<tspan class="st">"What is (12 + 8) * 3 / 4?"</tspan>)  <tspan class="cm"># 15</tspan></text>
</svg>
