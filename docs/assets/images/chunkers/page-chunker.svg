<text class="mono" x="84" y="381">Dr. Lee signs it within 3.5 days.</text></g>
<g class="c4"><rect class="card" x="40" y="396" width="880" height="30" rx="8"/>
<text class="tag" x="50" y="417">C4</text>
<text class="mono" x="84" y="417">A doctor's note is needed after three days.</text></g>
