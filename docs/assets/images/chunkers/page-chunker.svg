<rect class="bg" x="1" y="1" width="958" height="470" rx="14"/>
<text class="title" x="40" y="46">PageChunker</text>
<text class="sub" x="40" y="70">PageChunker(chunk_size=70, overlap=0): pages 1 and 2 would fit in one chunk, but a chunk never spans two pages.</text>
<text class="sub" x="40" y="90">Orange frame = the chunk being made. Filled orange = overlap, repeated from the chunk before.</text>
<text class="h" x="40" y="114">1. The text, cut into 3 pages (number = size in characters)</text>
<rect class="unit" x="40.0" y="128" width="366.4" height="26" rx="5"/>
<text class="mono" x="48.0" y="146">page 1: Leave policy↵↵Staff get twenty days.  36</text>
<rect class="unit" x="412.4" y="128" width="249.6" height="26" rx="5"/>
<text class="mono" x="420.4" y="146">page 2: Ask HR for the form.  20</text>
<rect class="unit" x="40.0" y="160" width="454.0" height="58" rx="5"/>
<text class="mono" x="48.0" y="178">page 3: Unused days carry over. Sick leave is separate. Dr. </text>
<text class="mono" x="48.0" y="194">Lee signs it within 3.5 days. A doctor's note is needed </text>
<text class="mono" x="48.0" y="210">after three days.  125</text>
