<text class="h" x="40" y="242">2. The chunks (real output)</text>
<g class="c0"><rect class="card" x="40" y="252" width="880" height="30" rx="8"/>
<text class="tag" x="50" y="273">C0</text>
<text class="mono" x="84" y="273">Leave policy↵↵Staff get twenty days.</text></g>
<g class="c1"><rect class="card" x="40" y="288" width="880" height="30" rx="8"/>
<text class="tag" x="50" y="309">C1</text>
<text class="mono" x="84" y="309">Ask HR for the form.</text></g>
<g class="c2"><rect class="card" x="40" y="324" width="880" height="30" rx="8"/>
