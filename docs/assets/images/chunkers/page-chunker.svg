<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472" width="960" height="472" role="img" aria-labelledby="title desc">
<title id="title">PageChunker</title>
<desc id="desc">PageChunker keeps every chunk inside one page: 3 pages give 5 chunks.</desc>
