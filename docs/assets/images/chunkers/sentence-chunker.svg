<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc">
<title id="title">SentenceChunker</title>
<desc id="desc">SentenceChunker cuts the text into 6 sentences and packs whole sentences into 5 chunks of at most 50 characters.</desc>
