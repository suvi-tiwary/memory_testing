<text class="sub" x="40" y="70">WordChunker(chunk_size=6, overlap=2): windows of 6 words, each starting 4 words after the last one.</text>
<text class="sub" x="40" y="90">Orange frame = the chunk being made. Filled orange = overlap, repeated from the chunk before.</text>
