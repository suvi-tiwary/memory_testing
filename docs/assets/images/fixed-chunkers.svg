<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc">
  <title id="title">One sentence, three units</title>
  <desc id="desc">The sentence "Staff get twenty days of paid leave every year." chunked three ways. CharacterChunker with size 18 and overlap 4 makes 4 chunks and cuts words in half. WordChunker with size 4 and overlap 1 makes 3 chunks of whole words. TokenChunker with size 5 and overlap 1 makes 3 chunks of model tokens. The repeated overlap at the start of each chunk is shown in orange.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #e2e8f0; }
      .title { font: 700 22px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .sub { font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .cls { font: 600 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e3a8a; }
      .set { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .row { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .pill { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.2; }
      .txt { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; white-space: pre; }
      .ov { fill: #ea580c; font-weight: 700; }
      .tok { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; }
      .toktxt { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #475569; white-space: pre; text-anchor: middle; }
      .note { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .hl { fill: none; stroke: #f97316; stroke-width: 3; opacity: 0; animation: glow 9s infinite; }
      @keyframes glow { 0% { opacity: 0; } 3% { opacity: 1; } 30% { opacity: 1; } 34% { opacity: 0; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .hl { animation: none; } }
    </style>
  </defs>

  <rect class="bg" x="1" y="1" width="958" height="468" rx="14"/>
  <text class="title" x="40" y="46">One sentence, three units</text>
  <text class="sub" x="40" y="70">"Staff get twenty days of paid leave every year."  =  47 characters  =  9 words  =  10 tokens (cl100k_base)</text>

  <!-- characters -->
  <rect class="row" x="30" y="96" width="900" height="82" rx="10"/>
  <text class="cls" x="48" y="128">CharacterChunker</text>
  <text class="set" x="48" y="150">size 18, overlap 4 → 4 chunks</text>
  <rect class="pill" x="282" y="118" width="152" height="38" rx="8"/>
  <text class="txt" x="292" y="142">'Staff get twenty d'</text>
  <rect class="pill" x="442" y="118" width="152" height="38" rx="8"/>
  <text class="txt" x="452" y="142">'<tspan class="ov">ty d</tspan>ays of paid le'</text>
  <rect class="pill" x="602" y="118" width="152" height="38" rx="8"/>
  <text class="txt" x="612" y="142">'<tspan class="ov">d le</tspan>ave every year'</text>
  <rect class="pill" x="762" y="118" width="62" height="38" rx="8"/>
  <text class="txt" x="772" y="142">'<tspan class="ov">year</tspan>.'</text>

  <!-- words -->
  <rect class="row" x="30" y="192" width="900" height="82" rx="10"/>
  <text class="cls" x="48" y="224">WordChunker</text>
  <text class="set" x="48" y="246">size 4, overlap 1 → 3 chunks</text>
  <rect class="pill" x="282" y="214" width="180" height="38" rx="8"/>
  <text class="txt" x="292" y="238">'Staff get twenty days'</text>
  <rect class="pill" x="470" y="214" width="160" height="38" rx="8"/>
  <text class="txt" x="480" y="238">'<tspan class="ov">days</tspan> of paid leave'</text>
  <rect class="pill" x="638" y="214" width="152" height="38" rx="8"/>
  <text class="txt" x="648" y="238">'<tspan class="ov">leave</tspan> every year.'</text>

  <!-- tokens -->
  <rect class="row" x="30" y="288" width="900" height="124" rx="10"/>
  <text class="cls" x="48" y="320">TokenChunker</text>
  <text class="set" x="48" y="342">size 5, overlap 1 → 3 chunks</text>
  <rect class="pill" x="282" y="310" width="200" height="38" rx="8"/>
  <text class="txt" x="292" y="334">'Staff get twenty days of'</text>
  <rect class="pill" x="490" y="310" width="208" height="38" rx="8"/>
  <text class="txt" x="500" y="334">'<tspan class="ov"> of</tspan> paid leave every year'</text>
  <rect class="pill" x="706" y="310" width="70" height="38" rx="8"/>
  <text class="txt" x="716" y="334">'<tspan class="ov"> year</tspan>.'</text>
  <!-- the 10 tokens -->
  <g>
    <rect class="tok" x="282" y="362" width="50" height="26" rx="5"/><text class="toktxt" x="307" y="380">Staff</text>
    <rect class="tok" x="336" y="362" width="44" height="26" rx="5"/><text class="toktxt" x="358" y="380">␣get</text>
    <rect class="tok" x="384" y="362" width="66" height="26" rx="5"/><text class="toktxt" x="417" y="380">␣twenty</text>
    <rect class="tok" x="454" y="362" width="52" height="26" rx="5"/><text class="toktxt" x="480" y="380">␣days</text>
    <rect class="tok" x="510" y="362" width="38" height="26" rx="5"/><text class="toktxt" x="529" y="380">␣of</text>
    <rect class="tok" x="552" y="362" width="52" height="26" rx="5"/><text class="toktxt" x="578" y="380">␣paid</text>
    <rect class="tok" x="608" y="362" width="58" height="26" rx="5"/><text class="toktxt" x="637" y="380">␣leave</text>
    <rect class="tok" x="670" y="362" width="58" height="26" rx="5"/><text class="toktxt" x="699" y="380">␣every</text>
    <rect class="tok" x="732" y="362" width="52" height="26" rx="5"/><text class="toktxt" x="758" y="380">␣year</text>
    <rect class="tok" x="788" y="362" width="26" height="26" rx="5"/><text class="toktxt" x="801" y="380">.</text>
  </g>
  <text class="set" x="48" y="380">tokens (␣ = space):</text>

  <text class="note" x="40" y="440"><tspan class="ov">Orange</tspan> = the overlap, repeated from the previous chunk. Characters cut words in half ('twenty d' | 'ty days');</text>
  <text class="note" x="40" y="458">words never do; tokens follow the model's vocabulary, so a long word can become several tokens.</text>

  <rect class="hl" x="26" y="92" width="908" height="90" rx="12" style="animation-delay:0s"/>
  <rect class="hl" x="26" y="188" width="908" height="90" rx="12" style="animation-delay:3s"/>
  <rect class="hl" x="26" y="284" width="908" height="132" rx="12" style="animation-delay:6s"/>
</svg>
