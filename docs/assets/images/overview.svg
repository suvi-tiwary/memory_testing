<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
  <title id="title">rag-titan at a glance</title>
  <desc id="desc">Indexing: files go through loader, chunker and embedder into a vector store. Answering: a question goes through retriever, reranker and generator to produce a cited answer.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #e2e8f0; }
      .title { font: 700 22px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .sub { font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .lane { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64748b; letter-spacing: .06em; }
      .label { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; }
      .ex { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; text-anchor: middle; }
      .note { font: 500 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; text-anchor: middle; }
      .code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #e2e8f0; white-space: pre; }
      .cm { fill: #94a3b8; }
      .kw { fill: #7dd3fc; }
      .st { fill: #86efac; }
      .neutral { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .index { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
      .search { fill: #ecfeff; stroke: #06b6d4; stroke-width: 1.5; }
      .llm { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; }
      .out { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 5; animation: dash 0.9s linear infinite; }
      .hl { fill: none; stroke: #f97316; stroke-width: 3; opacity: 0; animation: glow 10s infinite; }
      @keyframes dash { to { stroke-dashoffset: -11; } }
      @keyframes glow { 0% { opacity: 0; } 2% { opacity: 1; } 9% { opacity: 1; } 12% { opacity: 0; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .flow, .hl { animation: none; } }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="599" rx="16"/>
  <text class="title" x="30" y="44">rag-titan at a glance</text>
  <text class="sub" x="30" y="66">Index your files once, then ask as many questions as you like.</text>

  <!-- ① indexing lane -->
  <text class="lane" x="30" y="102">① INDEXING — rag.index(["handbook.pdf"])</text>
  <rect class="neutral" x="30" y="112" width="140" height="70" rx="10"/>
  <text class="label" x="100" y="140">Your files</text>
  <text class="ex" x="100" y="162">handbook.pdf</text>

  <rect class="index" x="220" y="112" width="140" height="70" rx="10"/>
  <text class="label" x="290" y="140">Loader</text>
  <text class="ex" x="290" y="162">PDF / DOCX → text</text>

  <rect class="index" x="410" y="112" width="140" height="70" rx="10"/>
  <text class="label" x="480" y="140">Chunker</text>
  <text class="ex" x="480" y="162">150-word chunks</text>

  <rect class="index" x="600" y="112" width="140" height="70" rx="10"/>
  <text class="label" x="670" y="140">Embedder</text>
  <text class="ex" x="670" y="162">text → vector</text>

  <rect class="index" x="790" y="112" width="140" height="70" rx="10"/>
  <text class="label" x="860" y="140">Vector store</text>
  <text class="ex" x="860" y="162">12 chunks saved</text>

  <path class="flow" d="M172 147 H216" marker-end="url(#arrow)"/>
  <path class="flow" d="M362 147 H406" marker-end="url(#arrow)"/>
  <path class="flow" d="M552 147 H596" marker-end="url(#arrow)"/>
  <path class="flow" d="M742 147 H786" marker-end="url(#arrow)"/>

  <!-- store feeds the retriever -->
  <path class="flow" d="M860 184 C860 250 290 236 290 298" marker-end="url(#arrow)"/>
  <rect x="490" y="222" width="190" height="22" rx="11" fill="#ffffff"/>
  <text class="note" x="585" y="237">search similar vectors</text>

  <!-- ② answering lane -->
  <text class="lane" x="30" y="292">② ANSWERING — rag.ask(...)</text>
  <rect class="neutral" x="30" y="302" width="140" height="70" rx="10"/>
  <text class="label" x="100" y="328">Question</text>
  <text class="ex" x="100" y="347">How many leave</text>
  <text class="ex" x="100" y="362">days?</text>

  <rect class="search" x="220" y="302" width="140" height="70" rx="10"/>
  <text class="label" x="290" y="330">Retriever</text>
  <text class="ex" x="290" y="352">top 5 by cosine</text>

  <rect class="search" x="410" y="302" width="140" height="70" rx="10"/>
  <text class="label" x="480" y="330">Reranker</text>
  <text class="ex" x="480" y="352">keep best 2</text>

  <rect class="out" x="600" y="302" width="140" height="70" rx="10"/>
  <text class="label" x="670" y="330">Generator</text>
  <text class="ex" x="670" y="352">answer + cite</text>

  <rect class="out" x="790" y="302" width="140" height="70" rx="10"/>
  <text class="label" x="860" y="330">Answer</text>
  <text class="ex" x="860" y="352">20 days [chunk_0]</text>

  <path class="flow" d="M172 337 H216" marker-end="url(#arrow)"/>
  <path class="flow" d="M362 337 H406" marker-end="url(#arrow)"/>
  <path class="flow" d="M552 337 H596" marker-end="url(#arrow)"/>
  <path class="flow" d="M742 337 H786" marker-end="url(#arrow)"/>

  <!-- LLM -->
  <rect class="llm" x="600" y="408" width="140" height="44" rx="10"/>
  <text class="label" x="670" y="429">LLM (Ollama)</text>
  <text class="ex" x="670" y="445">gemma3:4b</text>
  <path class="flow" d="M670 406 V378" marker-end="url(#arrow)"/>

  <!-- highlight moves through the steps in order -->
  <rect class="hl" x="30" y="112" width="140" height="70" rx="10" style="animation-delay:0s"/>
  <rect class="hl" x="220" y="112" width="140" height="70" rx="10" style="animation-delay:1s"/>
  <rect class="hl" x="410" y="112" width="140" height="70" rx="10" style="animation-delay:2s"/>
  <rect class="hl" x="600" y="112" width="140" height="70" rx="10" style="animation-delay:3s"/>
  <rect class="hl" x="790" y="112" width="140" height="70" rx="10" style="animation-delay:4s"/>
  <rect class="hl" x="30" y="302" width="140" height="70" rx="10" style="animation-delay:5s"/>
  <rect class="hl" x="220" y="302" width="140" height="70" rx="10" style="animation-delay:6s"/>
  <rect class="hl" x="410" y="302" width="140" height="70" rx="10" style="animation-delay:7s"/>
  <rect class="hl" x="600" y="302" width="140" height="70" rx="10" style="animation-delay:8s"/>
  <rect class="hl" x="790" y="302" width="140" height="70" rx="10" style="animation-delay:9s"/>

  <!-- code -->
  <rect x="30" y="476" width="900" height="100" rx="12" fill="#0f172a"/>
  <text class="code" x="52" y="504"><tspan class="kw">from</tspan> rag_titan <tspan class="kw">import</tspan> RAGTitan</text>
  <text class="code" x="52" y="525">rag = RAGTitan(rag_type=<tspan class="st">"simple"</tspan>)            <tspan class="cm"># or "adaptive"</tspan></text>
  <text class="code" x="52" y="546">rag.index([<tspan class="st">"handbook.pdf"</tspan>])                  <tspan class="cm"># ① indexing</tspan></text>
  <text class="code" x="52" y="567">rag.ask(<tspan class="st">"How many leave days?"</tspan>)              <tspan class="cm"># ② answering → "20 days [chunk_0]"</tspan></text>
</svg>
