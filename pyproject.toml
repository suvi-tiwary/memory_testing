# Packaging settings for rag-titan.
# Build:   python -m build
# Publish: twine upload dist/*   (or the GitHub "Publish" workflow)

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rag-titan"
dynamic = ["version"]
description = "A Swiss Army knife for RAG: simple, adaptive and more RAG types in one beginner-friendly package."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Kumar Nishant" }]
keywords = ["rag", "retrieval-augmented-generation", "llm", "ollama", "embeddings", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "numpy>=1.24",
    "ollama>=0.4.0",
    "pypdf>=4.0",
    "pytest>=8.4.2",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=5.0",
]
tokens = [
    "tiktoken>=0.7",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/aion7891/rag-titan"
Documentation = "https://aion7891.github.io/rag-titan"
Repository = "https://github.com/aion7891/rag-titan"
Issues = "https://github.com/aion7891/rag-titan/issues"
Changelog = "https://github.com/aion7891/rag-titan/blob/main/CHANGELOG.md"

[project.scripts]
rag-titan = "rag_titan.cli:main"

# the version lives in one place: src/rag_titan/__init__.py
[tool.hatch.version]
path = "src/rag_titan/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_titan"]

[tool.hatch.build.targets.sdist]
# a leading "/" means "only at the top", so tools/diagrams/README.md is not included
include = ["/src/rag_titan", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
